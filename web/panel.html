<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anthias Rooms VPS</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="panel.css"><script type="module" src="panel.js"></script></head><body>
<div id="gate" class="gate"><div class="gate-shell">
  <header class="gate-top"><div class="brand"><img class="brand-icon" src="icons/128.png" alt="" width="48" height="48"><span>Anthias Rooms<small>ANTHIAS PLAYER CONTROL</small></span></div><button hidden id="gate-logout" class="btn secondary logout-btn" data-i18n="Logout"></button><select id="gate-language" aria-label="Language"><option value="en">English</option><option value="it">Italiano</option></select></header>
  <div id="gate-body" class="gate-body internal-scroll"></div><footer id="gate-footer" class="gate-footer"></footer>
</div></div>
<div id="app" class="app" hidden>
<header class="topbar"><div class="brand"><img class="brand-icon" src="icons/128.png" alt="" width="48" height="48"><span>Anthias Rooms<small>ANTHIAS PLAYER CONTROL</small></span></div><nav class="main-nav"><button id="nav-content" class="nav-btn selected" data-i18n="Contents"></button><button id="nav-settings" class="nav-btn" data-i18n="Settings"></button></nav><div class="top-actions"><span class="version">VPS v1.0.1-dev5 DEV</span><button id="lock" class="btn secondary logout-btn" data-i18n="Logout"></button><button id="refresh" class="icon-btn" data-i18n-title="Refresh">↻</button></div></header>
<div class="app-body"><aside class="sidebar"><div class="sidebar-title"><span data-i18n="Players"></span><span id="room-count" class="counter"></span></div><input id="room-search" type="search" data-i18n-placeholder="Search players" hidden><div id="room-list" class="room-list internal-scroll"></div><button id="add-player" class="btn outline" data-i18n="Add player"></button><div id="fleet-status" class="sidebar-footer"></div></aside>
<main>
<section id="content-view" class="content-view"><header class="page-heading"><div class="heading-copy"><span class="eyebrow" data-i18n="Screen control"></span><div class="player-title-row"><h1 id="room-title"></h1><button id="quick-reboot" class="btn secondary reboot-shortcut" data-i18n-title="Reboot player" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.35 5.65"/></svg><span data-i18n="Reboot player"></span></button></div><span id="player-subtitle" class="muted"></span></div><div id="notice-anchor" class="notice-anchor" aria-hidden="true"></div><div class="heading-actions"><button id="restore-selected" class="btn secondary" data-i18n="Restore home content"></button><button id="player-media" class="text-btn" data-i18n="Player media" hidden></button></div></header>
<div id="no-rooms" class="empty-state" hidden><div class="empty-symbol">▦</div><h2 data-i18n="No players yet"></h2><p data-i18n="Add your first player or discover devices on your network."></p><div class="actions"><button id="empty-add" class="btn secondary" data-i18n="Add manually"></button><button id="empty-discover" class="btn primary" data-i18n="Discover players"></button></div></div>
<div id="room-content" class="room-content">
<div class="status-bar"><div class="status-left"><span id="connection" class="badge"></span><span id="mode-status"></span></div></div>

<div id="recovery" class="warning-strip" hidden><span data-i18n="Interrupted change detected."></span><button id="recover" class="btn secondary" data-i18n="Recover previous playlist"></button></div>
<div id="unconfigured" class="empty-state" hidden><h2 data-i18n="Not configured"></h2><button id="configure-player" class="btn primary" data-i18n="Edit player"></button></div>
<div id="work-area" class="work-area">
<article id="home-card" class="content-card"><div class="card-heading"><div><h2 data-i18n="Home content"></h2><p data-i18n="Default playlist"></p></div><span id="home-state" class="state-badge"></span></div>
 <div id="home-drop" class="drop-zone" tabindex="0" role="button" data-i18n-title="Drop files here"><div id="home-preview" class="preview"></div><div class="drop-overlay" data-i18n="Drop files here"></div></div>
 <div class="media-details"><div class="media-title"><strong id="home-name"></strong><span id="home-meta" class="muted"></span></div><div class="preview-nav"><button id="home-prev" class="icon-btn" data-i18n-title="Previous">‹</button><span id="home-count"></span><button id="home-next" class="icon-btn" data-i18n-title="Next">›</button><button id="home-expand" class="icon-btn" data-i18n-title="Preview">⛶</button></div></div>
 <span id="home-prepared" class="prepared-label" hidden></span><div class="card-actions"><button id="pick-home" class="btn secondary" data-i18n="Choose files"></button><button id="edit-home" class="text-btn" data-i18n="Edit playlist"></button></div><button id="show-home" class="btn primary show-btn" data-i18n="Show home"></button><input id="home-file" type="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.m4v,.webm" multiple hidden></article>
<article id="event-card" class="content-card"><div class="card-heading"><div><h2 data-i18n="Event"></h2><p data-i18n="Event playlist"></p></div><span id="event-state" class="state-badge"></span></div>
 <div id="event-drop" class="drop-zone" tabindex="0" role="button" data-i18n-title="Drop files here"><div id="event-preview" class="preview"></div><div class="drop-overlay" data-i18n="Drop files here"></div></div>
 <div class="media-details"><div class="media-title"><strong id="event-name"></strong><span id="event-meta" class="muted"></span></div><div class="preview-nav"><button id="event-prev" class="icon-btn" data-i18n-title="Previous">‹</button><span id="event-count"></span><button id="event-next" class="icon-btn" data-i18n-title="Next">›</button><button id="event-expand" class="icon-btn" data-i18n-title="Preview">⛶</button></div></div>
 <span id="event-prepared" class="prepared-label" hidden></span><div class="card-actions"><button id="pick-event" class="btn secondary" data-i18n="Choose files"></button><button id="edit-event" class="text-btn" data-i18n="Edit playlist"></button></div><button id="show-event" class="btn primary show-btn" data-i18n="Show event"></button><input id="event-file" type="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.m4v,.webm" multiple hidden></article>
</div>
<div id="room-operation" class="operation-strip" hidden><span id="operation-label"></span><progress id="progress" max="100"></progress></div>
<footer class="content-footer"><span id="status-detail"></span><div><span id="cleanup-status"></span><button id="retry-cleanup" class="text-btn" data-i18n="Retry cleanup" hidden></button></div></footer>
</div></section>
<section id="settings-view" class="settings-view" hidden><header class="page-heading settings-heading"><div><span class="eyebrow">ANTHIAS ROOMS</span><h1 data-i18n="Settings"></h1></div><div id="settings-notice-anchor" class="notice-anchor" aria-hidden="true"></div><div class="actions"><button id="settings-add" class="btn secondary" data-i18n="Add manually"></button><button id="settings-discover" class="btn primary" data-i18n="Discover players"></button></div></header>
<div class="settings-grid"><section class="settings-box players-settings"><div class="section-head"><h2 data-i18n="Players"></h2><button id="grant-access" class="text-btn" data-i18n="Grant network access"></button></div><div id="settings-rooms" class="internal-scroll"></div></section>
<div class="settings-right internal-scroll"><section class="settings-box"><h2 data-i18n="Appearance and behaviour"></h2><div class="field-row"><label for="language" data-i18n="Language"></label><select id="language"><option value="en">English</option><option value="it">Italiano</option></select></div><div class="field-row"><label for="image-duration" data-i18n="Default image duration"></label><div><input id="image-duration" type="number" min="1" max="86400" value="15"><span class="muted"> s</span></div></div><label class="check-row"><input id="auto-cleanup" type="checkbox"><span data-i18n="Automatically clean up event files"></span></label><p class="hint" data-i18n="Temporary event uploads are deleted after a verified switch. Home files and previously reused files remain protected."></p></section>
<section class="settings-box"><div class="section-head"><h2 data-i18n="Security"></h2><span id="security-status" class="badge"></span></div><p class="hint" data-i18n="Server login protects cloud access. Anthias players remain private behind the router."></p><div class="actions"><button id="change-password" class="btn secondary" data-i18n="Change password"></button><button hidden id="disable-password" class="text-btn" data-i18n="Disable password"></button></div></section>
<section class="settings-box"><h2 data-i18n="Configuration"></h2><a class="btn secondary" id="router-gui" target="_blank" rel="noopener" data-i18n="Open remote router"></a><button id="remote-router" class="btn secondary" data-i18n="Connect remote router"></button><div class="actions wrap"><button id="export-config" class="btn secondary" data-i18n="Export configuration"></button><button id="import-config" class="btn secondary" data-i18n="Import configuration"></button><button id="diagnostics" class="text-btn" data-i18n="Export diagnostics"></button></div><p class="hint" data-i18n="Configuration only: media files and the local password are not included."></p></section></div></div></section>
</main></div></div>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast" popover="manual" role="status" aria-live="polite" aria-atomic="true" hidden><span id="toast-text"></span><button id="toast-close" class="icon-btn" data-i18n-title="Close">×</button></div>
<dialog id="player-dialog" class="dialog compact"><form id="player-form" class="dialog-form"><header class="dialog-heading"><h2 id="player-title"></h2><button type="button" class="icon-btn" data-close="player-dialog" data-i18n-title="Close">×</button></header><div class="dialog-body"><label><span data-i18n="Name"></span><input id="player-name" required maxlength="40" autocomplete="off"><small id="name-count" class="field-hint"></small></label><label><span data-i18n="IP address or hostname"></span><input id="player-base" required maxlength="255" placeholder="192.168.1.20" autocomplete="off" spellcheck="false"></label><p id="player-error" class="inline-error" role="alert"></p></div><footer class="dialog-footer"><button type="button" class="btn secondary" data-close="player-dialog" data-i18n="Cancel"></button><button id="save-player" type="submit" class="btn primary" data-i18n="Save player"></button></footer></form></dialog>
<dialog id="editor-dialog" class="dialog editor-dialog"><header class="dialog-heading"><div><span id="editor-player" class="eyebrow"></span><h2 id="editor-title"></h2></div><button class="icon-btn" id="editor-close" data-i18n-title="Close">×</button></header><div class="editor-tools"><div class="actions wrap"><button id="editor-add" class="btn secondary" data-i18n="Add files"></button><button id="editor-library" class="btn secondary" data-i18n="Add from player media" hidden></button><button id="editor-clear" class="text-btn" data-i18n="Clear playlist"></button></div><p class="hint" data-i18n="Videos play to the end"></p></div><div id="editor-list" class="editor-list internal-scroll"></div><div class="editor-status"><span id="editor-summary"></span><span id="editor-error" class="inline-error" role="alert"></span><span id="editor-progress-text"></span><progress id="editor-progress" max="100" hidden></progress></div><footer class="dialog-footer"><span class="hint" data-i18n="Changes are not live until you publish."></span><button id="editor-save" class="btn secondary" data-i18n="Save without showing"></button><button id="editor-publish" class="btn primary" data-i18n="Upload and show"></button></footer><input id="editor-file" type="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.m4v,.webm" multiple hidden></dialog>
<dialog id="library-dialog" class="dialog wide"><header class="dialog-heading"><h2 id="library-title"></h2><button class="icon-btn" data-close="library-dialog" data-i18n-title="Close">×</button></header><div class="dialog-body library-body"><input id="library-search" type="search" data-i18n-placeholder="Search files"><div id="library-list" class="internal-scroll"></div></div><footer class="dialog-footer"><div class="library-footer-copy"><span id="library-note" class="hint"></span><span id="library-error" class="inline-error" role="alert"></span></div><button id="library-use" class="btn primary" data-i18n="Use selected" hidden disabled></button><button class="btn secondary" data-close="library-dialog" data-i18n="Close"></button></footer></dialog>
<dialog id="fleet-dialog" class="dialog wide"><header class="dialog-heading"><h2 data-i18n="Restore home content"></h2><button class="icon-btn" data-close="fleet-dialog" data-i18n-title="Close">×</button></header><div class="dialog-body"><p data-i18n="Each selected player returns to its own Home playlist."></p><label class="check-row"><input id="fleet-select-all" type="checkbox"><span data-i18n="Select all available"></span></label><div id="fleet-rooms" class="internal-scroll"></div><p id="fleet-result" class="inline-result" role="status"></p></div><footer class="dialog-footer"><button class="btn secondary" data-close="fleet-dialog" data-i18n="Close"></button><button id="fleet-go" class="btn primary" data-i18n="Restore selected"></button></footer></dialog>
<dialog id="discovery-dialog" class="dialog wide"><header class="dialog-heading"><h2 data-i18n="Discover players"></h2><button class="icon-btn" id="discovery-close" data-i18n-title="Close">×</button></header>
<div class="dialog-body discovery-body">
  <div class="scan-fields"><label><span data-i18n="IP address or network"></span><input id="scan-address" placeholder="192.168.1.0/24" maxlength="32" spellcheck="false" autocomplete="off"></label><label><span data-i18n="Subnet"></span><input id="scan-subnet" value="24" placeholder="/24 or 255.255.255.0" maxlength="15" spellcheck="false" autocomplete="off"></label></div>
  <p id="scan-network" class="hint"></p>
  <details id="scan-advanced"><summary data-i18n="Advanced"></summary><div class="scan-advanced-fields"><label><span data-i18n="Port"></span><input id="scan-port" type="number" value="80" min="1" max="65535"></label><label><span data-i18n="Protocol"></span><select id="scan-protocol"><option value="http">HTTP</option><option value="https">HTTPS</option></select></label></div><p class="hint" data-i18n="HTTP search on a network you manage. The subnet is saved, not detected from this computer."></p></details>
  <div class="scan-actions"><button id="scan-go" class="btn primary" data-i18n="Search"></button><button id="scan-stop" class="btn secondary" data-i18n="Stop" disabled></button><button id="scan-deep" class="text-btn" data-i18n="Search again, more thoroughly" hidden></button><span id="scan-status" class="hint" role="status"></span></div>
  <progress id="scan-progress" max="100" value="0"></progress><p id="scan-error" class="inline-error" role="alert"></p><div id="scan-results" class="internal-scroll"></div>
</div><footer class="dialog-footer"><span class="hint" data-i18n="Found a player? Select it and add it now."></span><button class="btn secondary" id="discovery-done" data-i18n="Close"></button><button class="btn primary" id="scan-add" data-i18n="Add selected" disabled></button></footer></dialog>
<dialog id="security-dialog" class="dialog compact"><form id="security-form" class="dialog-form"><header class="dialog-heading"><h2 id="security-title"></h2><button type="button" class="icon-btn" data-close="security-dialog" data-i18n-title="Close">×</button></header><div class="dialog-body"><label id="current-password-label"><span data-i18n="Current password"></span><input id="current-password" type="password" autocomplete="current-password" maxlength="128"></label><div id="new-password-fields"><label><span data-i18n="New password"></span><input id="new-password" type="password" autocomplete="new-password" maxlength="128" minlength="8"></label><label><span data-i18n="Confirm password"></span><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128" minlength="8"></label></div><p id="security-error" class="inline-error" role="alert"></p></div><footer class="dialog-footer"><button type="button" class="btn secondary" data-close="security-dialog" data-i18n="Cancel"></button><button id="security-save" type="submit" class="btn primary" data-i18n="Save"></button></footer></form></dialog>
<dialog id="orientation-dialog" class="dialog compact"><header class="dialog-heading"><h2 id="orientation-title"></h2><button class="icon-btn" data-close="orientation-dialog" data-i18n-title="Close">×</button></header><div class="dialog-body"><label for="orientation-select" data-i18n="Screen orientation"></label><select id="orientation-select"><option value="0" data-i18n="Landscape (0°)"></option><option value="90" data-i18n="Portrait (90°)"></option><option value="180" data-i18n="Landscape, inverted (180°)"></option><option value="270" data-i18n="Portrait, inverted (270°)"></option></select><p id="orientation-status" class="hint" role="status"></p><p id="orientation-error" class="inline-error" role="alert"></p></div><footer class="dialog-footer"><button class="btn secondary" data-close="orientation-dialog" data-i18n="Cancel"></button><button id="orientation-save" class="btn primary" data-i18n="Apply"></button></footer></dialog>
<dialog id="info-dialog" class="dialog compact"><header class="dialog-heading"><h2 id="info-title"></h2><button class="icon-btn" data-close="info-dialog" data-i18n-title="Close">×</button></header><div class="dialog-body"><dl id="info-data"></dl><button id="info-memory" class="btn secondary" data-i18n="Player media"></button></div><footer class="dialog-footer"><button id="open-anthias" class="btn secondary" data-i18n="Access player"></button><button id="reboot" class="btn danger" data-i18n="Reboot player"></button></footer></dialog>
<dialog id="preview-dialog" class="dialog preview-dialog"><header class="dialog-heading"><h2 id="preview-title"></h2><button class="icon-btn" data-close="preview-dialog" data-i18n-title="Close">×</button></header><div id="large-preview" class="preview"></div><footer class="dialog-footer"><span class="hint" data-i18n="This preview is not the current HDMI frame."></span><button class="btn secondary" data-close="preview-dialog" data-i18n="Close"></button></footer></dialog>
<dialog id="confirm-dialog" class="dialog compact"><header class="dialog-heading"><h2 id="confirm-title"></h2></header><div class="dialog-body"><p id="confirm-text"></p></div><footer class="dialog-footer"><button id="confirm-no" class="btn secondary" data-i18n="Cancel"></button><button id="confirm-yes" class="btn primary" data-i18n="Confirm"></button></footer></dialog>
</body></html>
