name: Tests and release
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: anthias-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'develop' }}
jobs:
  install-purge-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie', 'debian:bookworm', 'ubuntu:24.04']
        kind: [fresh, legacy]
    steps:
      - uses: actions/checkout@v4
      - name: Install, purge, reinstall and purge with real services
        run: bash tests/run_install_cycle.sh '${{ matrix.image }}' '${{ matrix.kind }}'
  frontend-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg for thumbnail tests
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg
          fi
      - name: Install Playwright
        timeout-minutes: 3
        run: npm install --no-save --package-lock=false --fetch-retries=2 --fetch-timeout=30000 playwright@1.55.0
      - name: Install Chromium and browser libraries
        timeout-minutes: 4
        run: npx playwright install --with-deps chromium
      - uses: actions/checkout@v4
        with:
          ref: 76ad9e71a97b538a5621e579dba0b56308a93777
          path: tests/fixtures/chrome
      - name: Verify local Chrome and VPS synchronization
        env:
          AR_EXTENSION_DIR: ${{ github.workspace }}/tests/fixtures/chrome/extension
        run: python3 tests/test_controller_sync.py
      - name: Verify mobile and desktop layouts
        run: python3 tests/test_browser.py
  test-and-release:
    needs: [install-purge-cycle, frontend-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx openssl ffmpeg
      - name: Verify source and installer
        run: |
          bash -n bootstrap.sh install.sh
          python3 -m py_compile server.py wg-helper.py nginx-config.py scripts/build_release.py
          for file in web/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          python3 tests/test_backend.py
          python3 tests/test_wireguard.py
          sudo env AR_PACKAGE_INTEGRATION=1 python3 tests/test_packages.py
          sudo python3 tests/test_installer.py
          python3 tests/test_nginx.py
      - name: Build reproducible release assets
        run: python3 scripts/build_release.py
      - name: Validate release channel
        if: github.event_name == 'push'
        run: |
          python3 - <<'PYCHANNEL'
          import json, os, re
          version = json.load(open('package.json'))['version']
          branch = os.environ['GITHUB_REF_NAME']
          pattern = r'\d+\.\d+\.\d+' if branch == 'main' else r'\d+\.\d+\.\d+-dev\d+'
          assert re.fullmatch(pattern, version), f'Invalid {branch} version: {version}'
          PYCHANNEL
      - name: Publish versioned release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          tag="v${version}"
          channel=GOLDEN
          flags=(--latest)
          edit_flags=(--prerelease=false --latest)
          if [ "$GITHUB_REF_NAME" = develop ]; then
            channel=DEV
            flags=(--prerelease --latest=false)
            edit_flags=(--prerelease --latest=false)
          fi
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            if [ "$(cat /tmp/release-draft)" != true ]; then
              echo "Release already published; bump the version before changing its assets."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft "${flags[@]}" --title "Anthias Rooms VPS v${version} ${channel}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false "${edit_flags[@]}"
